<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>HoodLust Access Pass Whitelist</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>
  <div id="game-root"></div>

  <div id="boot-overlay">
    <div class="boot-logo">HOODLUST</div>
    <div class="boot-sub">ACCESS PASS</div>
    <div class="boot-bar"><div class="boot-fill" id="boot-fill"></div></div>
    <div class="boot-pct" id="boot-pct">0%</div>
    <div class="boot-hint">Preparing the whitelist&hellip;</div>
  </div>

  <div id="intro-screen">
    <video id="intro-bg" muted playsinline preload="auto"></video>
    <video id="intro-video" muted playsinline preload="auto"></video>
    <div id="intro-placeholder">
      <div class="ph-crest">&#9829;</div>
      <div class="ph-title">HOODLUST</div>
      <div class="ph-sub">ACCESS PASS</div>
    </div>
  </div>

  <div id="join-screen">
    <div class="join-badge">HOODLUST COLLECTION</div>
    <div class="join-title">HOODLUST<br/>ACCESS PASS</div>
    <div class="join-sub">Join Whitelist</div>
    <button class="join-btn" id="join-btn">Join Whitelist</button>
    <div class="join-foot">An official HoodLust experience</div>
  </div>

  <div id="touch-controls" class="hidden">
    <div id="joystick-base"><div id="joystick-thumb"></div></div>
    <button id="run-btn">RUN</button>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
